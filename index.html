<style>
  :root {
    --bg: #eef1f2;
    --grid-line: #ccd4d8;
    --surface: #ffffff;
    --surface-2: #e3e9ec;
    --text: #12161a;
    --muted: #55626c;
    --accent: #b56d00;
    --accent-ink: #ffffff;
    --border: #d7dee1;
    --shadow: 220 20% 30%;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10151a;
      --grid-line: #253039;
      --surface: #1a2029;
      --surface-2: #232b34;
      --text: #edf2f5;
      --muted: #98a5b0;
      --accent: #f2a30f;
      --accent-ink: #17130a;
      --border: #2b3540;
      --shadow: 220 60% 2%;
    }
  }

  :root[data-theme="dark"] {
    --bg: #10151a;
    --grid-line: #253039;
    --surface: #1a2029;
    --surface-2: #232b34;
    --text: #edf2f5;
    --muted: #98a5b0;
    --accent: #f2a30f;
    --accent-ink: #17130a;
    --border: #2b3540;
    --shadow: 220 60% 2%;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px 64px;
    position: relative;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* faint circuit-trace field behind the card */
  .circuit-field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.55;
  }
  .circuit-field svg { width: 100%; height: 100%; }
  .circuit-field line, .circuit-field path {
    stroke: var(--grid-line);
    stroke-width: 1;
    fill: none;
  }
  .circuit-field circle {
    fill: var(--grid-line);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 36px 28px 28px;
    box-shadow: 0 1px 2px hsl(var(--shadow) / 0.06), 0 18px 40px -20px hsl(var(--shadow) / 0.35);
  }

  .mark {
    width: 40px;
    height: 40px;
    margin: 0 auto 18px;
    display: block;
  }
  .mark path { fill: var(--accent); }

  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin: 0 0 10px;
  }

  h1 {
    font-family: "Oswald", ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1.05;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    text-align: center;
    margin: 0 0 6px;
    text-wrap: balance;
  }

  .tagline {
    text-align: center;
    color: var(--muted);
    font-size: 14.5px;
    margin: 0 0 26px;
  }

  .call {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--accent);
    color: var(--accent-ink);
    text-decoration: none;
    border-radius: 12px;
    padding: 16px 18px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: 0.03em;
    font-variant-numeric: tabular-nums;
    margin-bottom: 22px;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  .call:hover { filter: brightness(1.06); }
  .call:active { transform: scale(0.99); }
  .call:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .call svg { width: 20px; height: 20px; flex: none; }
  .call svg path { stroke: currentColor; }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.15s ease, transform 0.15s ease;
  }
  .link-row:hover { border-color: var(--accent); }
  .link-row:active { transform: scale(0.99); }
  .link-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .icon {
    width: 38px;
    height: 38px;
    flex: none;
    border-radius: 9px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon svg { width: 19px; height: 19px; }
  .icon svg path, .icon svg circle, .icon svg rect { stroke: var(--accent); }

  .link-text { flex: 1; min-width: 0; }
  .link-label {
    font-weight: 600;
    font-size: 15px;
    line-height: 1.2;
  }
  .link-sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .go {
    flex: none;
    color: var(--muted);
    width: 16px;
    height: 16px;
  }
  .go path { stroke: var(--muted); }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  @media (prefers-reduced-motion: reduce) {
    .call, .link-row { transition: none; }
  }
</style>
